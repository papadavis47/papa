name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libvulkan-dev
      # Turso's CLI, for the tests that sync through `tursodb --sync-server`.
      # Pinned and checked against the release's checksums.
      - name: Install tursodb 0.8.2
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   triple=x86_64-unknown-linux-gnu; sum=1a12393fdb1fc36ef4c0339609b2652d6a0f7bb4a5f6c08da4afe1d364422d18 ;;
            macOS-ARM64) triple=aarch64-apple-darwin;     sum=abeeeaa7b90bc1c8b66425cfd802e9f8081dde85508688152e6f788b41597845 ;;
            *) echo "no tursodb pinned for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          archive="turso_cli-$triple.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/tursodatabase/turso/releases/download/v0.8.2/$archive"
          echo "$sum  $archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf "$archive" --strip-components=1 -C "$HOME/.local/bin" "turso_cli-$triple/tursodb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # The sync tests fail rather than skip without tursodb.
          PAPA_REQUIRE_TURSODB: "1"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
