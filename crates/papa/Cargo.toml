[package]
name = "papa"
description = "Papa desktop app: a private journal for fathers about their children."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Errors the app only reports, with context added along the way. papa-core
# uses typed `thiserror` errors instead, so callers can match on them.
anyhow = "1.0.104"
# gpui-kit bundles gpui (gpui-pre), gpui_platform (font-kit/x11/wayland), gpui-base,
# gpui-component and assets at matching versions. Don't list gpui separately —
# a second gpui crate won't unify with the one gpui-kit uses.
# This is the only crate in the workspace that may depend on gpui-kit.
gpui-kit = "0.7"
# Formats note dates in the local time zone.
jiff = "0.2.38"
papa-core.workspace = true
# The relay's wire types: `Secret`, for passwords and invite codes typed in
# the account dialogs.
papa-proto.workspace = true
# Exports notes to PDF. It brings in Typst, which is big; keeping it in
# its own crate means papa-core and the relay don't build it.
papa-pdf.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The same gpui-kit, plus a headless test window for UI tests: render real
# components, press keys, then check state, focus and callbacks.
gpui-kit = { version = "0.7", features = ["test-support"] }
