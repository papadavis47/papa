[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` / `cargo build` at the root target the desktop app.
default-members = ["crates/papa"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/papadavis47/papa"
publish = false

[workspace.dependencies]
papa-core = { path = "crates/papa-core" }
papa-proto = { path = "crates/papa-proto" }
papa-pdf = { path = "crates/papa-pdf" }
# Pre-1.0, so pinned exactly (ADR 0003), in one place for the vault and
# the relay.
turso = { version = "=0.8.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# What the packages are built with (`cargo build --profile dist`). `release`
# is left as Cargo's default: optimised, no debug info, symbols kept.
# - Thin LTO lets LLVM inline across crates. The code gets slightly bigger,
#   not smaller, and the build takes about as long as `release`.
# - No symbols either: they are 37 MB of a 155 MB binary, and a user never
#   sees a backtrace. Build with `release` to debug a crash.
# (`codegen-units = 1` would optimise a little further, but compiling
# turso_core that way needs more memory than a 7 GB machine, such as GitHub's
# macOS runner, has.)
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

# Image codecs are pure Rust and painfully slow unoptimised: decoding one
# phone photo takes seconds in a plain debug build. Optimising just these
# crates keeps debug builds of our own code fast to compile.
[profile.dev.package]
image = { opt-level = 3 }
image-webp = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
gif = { opt-level = 3 }
weezl = { opt-level = 3 }
moxcms = { opt-level = 3 }
sha2 = { opt-level = 3 }
# Same for the vault's encryption: unoptimised, Argon2id takes seconds to
# unlock and every page read pays for slow AEGIS.
aegis = { opt-level = 3 }
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
