[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` / `cargo build` at the root target the desktop app.
default-members = ["crates/papa"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/papadavis47/papa"
publish = false

[workspace.dependencies]
papa-core = { path = "crates/papa-core" }
papa-proto = { path = "crates/papa-proto" }
papa-pdf = { path = "crates/papa-pdf" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
