[package]
name = "papa-pdf"
description = "Papa PDF export: Markdown notes to typeset PDF."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
markdown = "1.0.0"
thiserror = "2.0.21"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
